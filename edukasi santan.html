<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petualangan Kuis Edukasi</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Fredoka', cursive, sans-serif;
            background: linear-gradient(135deg, #6EE7B7 0%, #3B82F6 50%, #9333EA 100%);
            min-height: 100vh;
        }
        .card-bounce {
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        .shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">

    <!-- Container Utama -->
    <div class="w-full max-w-xl bg-white rounded-3xl shadow-2xl overflow-hidden border-4 border-yellow-300 relative">
        
        <!-- Header Aplikasi -->
        <header class="bg-yellow-400 p-4 text-center border-b-4 border-yellow-500 relative">
            <h1 class="text-3xl font-extrabold text-white drop-shadow-md tracking-wide flex items-center justify-center gap-2">
                <i class="fa-solid fa-gamepad text-purple-600"></i> Kuis Edukasi Super!
            </h1>
            <p class="text-sm font-semibold text-yellow-900 mt-1">Belajar Seru Sampai Pintar 🌟</p>
            
            <!-- Tombol Mute Sound -->
            <button id="btn-sound" onclick="toggleSound()" class="absolute top-4 right-4 bg-white/80 hover:bg-white text-yellow-900 p-2 rounded-full w-10 h-10 flex items-center justify-center shadow transition">
                <i id="icon-sound" class="fa-solid fa-volume-high"></i>
            </button>
        </header>

        <!-- Dynamic Screen Content -->
        <main class="p-6">
            
            <!-- 1. Halaman Beranda / Pilih Kategori -->
            <div id="screen-home" class="space-y-6">
                <div class="text-center">
                    <h2 class="text-2xl font-bold text-gray-800">Pilih Kategori Permainan:</h2>
                    <p class="text-gray-500 text-sm">Kumpulkan bintang dan jadi juaranya!</p>
                </div>

                <div class="grid grid-cols-1 gap-4">
                    <button onclick="selectCategory('math')" class="card-bounce bg-emerald-100 hover:bg-emerald-200 border-2 border-emerald-400 p-4 rounded-2xl flex items-center gap-4 text-left transition transform active:scale-95 shadow-md">
                        <div class="bg-emerald-500 text-white w-14 h-14 rounded-xl flex items-center justify-center text-2xl shadow">
                            <i class="fa-solid fa-calculator"></i>
                        </div>
                        <div>
                            <h3 class="text-xl font-bold text-emerald-900">Matematika Ceria</h3>
                            <p class="text-xs text-emerald-700">Asah kemampuan berhitung dan logika</p>
                        </div>
                    </button>

                    <button onclick="selectCategory('english')" class="card-bounce bg-sky-100 hover:bg-sky-200 border-2 border-sky-400 p-4 rounded-2xl flex items-center gap-4 text-left transition transform active:scale-95 shadow-md" style="animation-delay: 0.2s;">
                        <div class="bg-sky-500 text-white w-14 h-14 rounded-xl flex items-center justify-center text-2xl shadow">
                            <i class="fa-solid fa-language"></i>
                        </div>
                        <div>
                            <h3 class="text-xl font-bold text-sky-900">Bahasa Inggris</h3>
                            <p class="text-xs text-sky-700">Belajar kosakata dasar dengan mudah</p>
                        </div>
                    </button>

                    <button onclick="selectCategory('general')" class="card-bounce bg-purple-100 hover:bg-purple-200 border-2 border-purple-400 p-4 rounded-2xl flex items-center gap-4 text-left transition transform active:scale-95 shadow-md" style="animation-delay: 0.4s;">
                        <div class="bg-purple-500 text-white w-14 h-14 rounded-xl flex items-center justify-center text-2xl shadow">
                            <i class="fa-solid fa-globe"></i>
                        </div>
                        <div>
                            <h3 class="text-xl font-bold text-purple-900">Pengetahuan Umum</h3>
                            <p class="text-xs text-purple-700">Fakta sains, alam, dan dunia</p>
                        </div>
                    </button>
                </div>

                <!-- Info Skor Tertinggi -->
                <div class="bg-yellow-50 rounded-2xl p-4 text-center border border-yellow-200 shadow-inner">
                    <span class="text-sm font-semibold text-yellow-800">Skor Tertinggi Kamu: </span>
                    <span id="high-score" class="text-lg font-bold text-yellow-600">0</span> Poin 🏆
                </div>
            </div>

            <!-- 2. Halaman Permainan Kuis -->
            <div id="screen-quiz" class="hidden space-y-6">
                <!-- Bar Statistik Pertanyaan -->
                <div class="flex justify-between items-center bg-gray-100 p-3 rounded-xl border border-gray-200 text-sm font-bold">
                    <span id="quiz-category" class="text-purple-600 uppercase">MATEMATIKA</span>
                    <div class="flex items-center gap-4">
                        <span class="text-emerald-600"><i class="fa-solid fa-star text-yellow-400"></i> <span id="current-score">0</span></span>
                        <span class="text-rose-500"><i class="fa-solid fa-clock"></i> <span id="timer">15</span>s</span>
                    </div>
                </div>

                <!-- Progress Bar -->
                <div class="w-full bg-gray-200 h-3 rounded-full overflow-hidden">
                    <div id="progress-bar" class="bg-emerald-500 h-full w-0 transition-all duration-300"></div>
                </div>

                <!-- Kartu Soal -->
                <div id="quiz-card" class="bg-white border-2 border-gray-200 p-6 rounded-2xl shadow-sm text-center">
                    <p id="question-number" class="text-xs font-bold text-gray-400 mb-2">Soal 1 dari 5</p>
                    <h3 id="question-text" class="text-2xl font-bold text-gray-800 min-h-[60px] flex items-center justify-center">
                        Berapakah 5 + 3?
                    </h3>
                </div>

                <!-- Pilihan Jawaban -->
                <div id="options-container" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <!-- Tombol pilihan akan di-generate via JavaScript -->
                </div>
            </div>

            <!-- 3. Halaman Hasil / Skor Akhir -->
            <div id="screen-result" class="hidden text-center space-y-6 py-4">
                <div class="inline-block p-4 bg-yellow-100 rounded-full border-4 border-yellow-400 text-5xl text-yellow-500">
                    <i id="result-icon" class="fa-solid fa-trophy"></i>
                </div>

                <div>
                    <h2 id="result-title" class="text-3xl font-extrabold text-gray-800">Luar Biasa!</h2>
                    <p id="result-desc" class="text-gray-600 mt-1">Kamu menyelesaikan semua pertanyaan!</p>
                </div>

                <!-- Box Detail Skor -->
                <div class="bg-gray-50 rounded-2xl p-4 border border-gray-200 max-w-xs mx-auto space-y-2">
                    <div class="flex justify-between text-sm">
                        <span class="text-gray-500">Total Skor:</span>
                        <span id="final-score" class="font-bold text-emerald-600 text-lg">0</span>
                    </div>
                    <div class="flex justify-between text-sm">
                        <span class="text-gray-500">Jawaban Benar:</span>
                        <span id="final-correct" class="font-bold text-blue-600">0 / 5</span>
                    </div>
                </div>

                <div class="flex justify-center gap-3">
                    <button onclick="showHome()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-3 px-6 rounded-xl transition shadow">
                        <i class="fa-solid fa-house"></i> Beranda
                    </button>
                    <button onclick="restartQuiz()" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 px-6 rounded-xl transition shadow">
                        <i class="fa-solid fa-rotate-right"></i> Main Lagi
                    </button>
                </div>
            </div>

        </main>
    </div>

    <!-- Script Game Logic -->
    <script>
        // Database Bank Soal
        const quizData = {
            math: [
                { q: "Berapakah hasil dari 7 + 8?", options: ["13", "15", "14", "16"], answer: 1 },
                { q: "Berapakah hasil dari 12 - 5?", options: ["6", "7", "8", "9"], answer: 1 },
                { q: "Berapakah hasil dari 4 × 3?", options: ["12", "10", "14", "16"], answer: 0 },
                { q: "Angka manakah yang genap?", options: ["3", "7", "8", "9"], answer: 2 },
                { q: "Berapakah 20 dibagi 4?", options: ["4", "5", "6", "10"], answer: 1 }
            ],
            english: [
                { q: "Apa arti kata 'Apple' dalam bahasa Indonesia?", options: ["Pisang", "Jeruk", "Apel", "Anggur"], answer: 2 },
                { q: "Manakah warna yang berarti 'Blue'?", options: ["Merah", "Biru", "Hijau", "Kuning"], answer: 1 },
                { q: "Hewan apa yang disebut 'Dog'?", options: ["Kucing", "Anjing", "Kelinci", "Burung"], answer: 1 },
                { q: "Bahasa Inggris dari angka 'Delapan' adalah...", options: ["Seven", "Eight", "Nine", "Ten"], answer: 1 },
                { q: "Lengkapi kalimat: 'I ... reading a book.'", options: ["is", "am", "are", "be"], answer: 1 }
            ],
            general: [
                { q: "Apa warna bendera negara Indonesia?", options: ["Merah Putih", "Biru Putih", "Hijau Kuning", "Merah Hitam"], answer: 0 },
                { q: "Hewan manakah yang bertelur?", options: ["Sapi", "Kucing", "Ayam", "Anjing"], answer: 2 },
                { q: "Planet terdekat dari Matahari adalah...", options: ["Bumi", "Mars", "Merkurius", "Venus"], answer: 2 },
                { q: "Organ tubuh yang berfungsi memompa darah adalah...", options: ["Paru-paru", "Jantung", "Lambung", "Hati"], answer: 1 },
                { q: "Air menguap jika dipanaskan menjadi...", options: ["Es", "Uap/Gas", "Tanah", "Batu"], answer: 1 }
            ]
        };

        // Web Audio API Synthesizer (Tanpa File Eksternal)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let soundEnabled = true;

        function playSound(type) {
            if (!soundEnabled) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;
            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now); // C5
                osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.15); // E5
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.2);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const icon = document.getElementById('icon-sound');
            if (soundEnabled) {
                icon.className = 'fa-solid fa-volume-high';
            } else {
                icon.className = 'fa-solid fa-volume-xmark text-gray-400';
            }
        }

        // Variable State Game
        let currentCategory = '';
        let currentQuestions = [];
        let questionIndex = 0;
        let score = 0;
        let correctAnswersCount = 0;
        let timerInterval = null;
        let timeLeft = 15;

        // Navigasi Layar
        function showScreen(screenId) {
            document.getElementById('screen-home').classList.add('hidden');
            document.getElementById('screen-quiz').classList.add('hidden');
            document.getElementById('screen-result').classList.add('hidden');
            document.getElementById(screenId).classList.remove('hidden');
        }

        function showHome() {
            clearInterval(timerInterval);
            updateHighScoreUI();
            showScreen('screen-home');
        }

        // Inisialisasi Kuis
        function selectCategory(cat) {
            currentCategory = cat;
            currentQuestions = [...quizData[cat]];
            questionIndex = 0;
            score = 0;
            correctAnswersCount = 0;
            
            document.getElementById('quiz-category').innerText = cat;
            document.getElementById('current-score').innerText = score;

            showScreen('screen-quiz');
            loadQuestion();
        }

        // Muat Pertanyaan
        function loadQuestion() {
            clearInterval(timerInterval);
            const qData = currentQuestions[questionIndex];

            // Update Header & Progress
            document.getElementById('question-number').innerText = `Soal ${questionIndex + 1} dari ${currentQuestions.length}`;
            document.getElementById('question-text').innerText = qData.q;
            document.getElementById('progress-bar').style.width = `${((questionIndex + 1) / currentQuestions.length) * 100}%`;

            // Render Pilihan Jawaban
            const container = document.getElementById('options-container');
            container.innerHTML = '';

            qData.options.forEach((option, idx) => {
                const btn = document.createElement('button');
                btn.className = "w-full bg-white border-2 border-gray-300 hover:border-indigo-500 hover:bg-indigo-50 font-semibold p-4 rounded-xl text-gray-700 text-left transition transform active:scale-95 shadow-sm text-lg flex justify-between items-center";
                btn.innerHTML = `<span>${option}</span> <i class="fa-regular fa-circle text-gray-300"></i>`;
                btn.onclick = () => checkAnswer(idx, btn);
                container.appendChild(btn);
            });

            // Start Timer
            startTimer();
        }

        // Pengatur Waktu Soal
        function startTimer() {
            timeLeft = 15;
            document.getElementById('timer').innerText = timeLeft;
            
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').innerText = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    playSound('wrong');
                    highlightCorrectAnswer();
                    setTimeout(nextQuestion, 1500);
                }
            }, 1000);
        }

        // Cek Jawaban User
        function checkAnswer(selectedIndex, btnElement) {
            clearInterval(timerInterval);
            const qData = currentQuestions[questionIndex];
            const allButtons = document.getElementById('options-container').children;

            // Nonaktifkan semua tombol
            for (let btn of allButtons) {
                btn.disabled = true;
            }

            if (selectedIndex === qData.answer) {
                // Jawaban Benar
                playSound('correct');
                btnElement.className = "w-full bg-emerald-500 border-2 border-emerald-600 text-white font-bold p-4 rounded-xl text-left shadow-md flex justify-between items-center";
                btnElement.querySelector('i').className = "fa-solid fa-circle-check text-white";
                
                score += 20 + timeLeft; // Bonus poin dari sisa waktu
                correctAnswersCount++;
                document.getElementById('current-score').innerText = score;
            } else {
                // Jawaban Salah
                playSound('wrong');
                document.getElementById('quiz-card').classList.add('shake');
                setTimeout(() => document.getElementById('quiz-card').classList.remove('shake'), 500);

                btnElement.className = "w-full bg-rose-500 border-2 border-rose-600 text-white font-bold p-4 rounded-xl text-left shadow-md flex justify-between items-center";
                btnElement.querySelector('i').className = "fa-solid fa-circle-xmark text-white";

                highlightCorrectAnswer();
            }

            setTimeout(nextQuestion, 1500);
        }

        function highlightCorrectAnswer() {
            const qData = currentQuestions[questionIndex];
            const allButtons = document.getElementById('options-container').children;
            const correctBtn = allButtons[qData.answer];
            
            correctBtn.className = "w-full bg-emerald-100 border-2 border-emerald-500 text-emerald-800 font-bold p-4 rounded-xl text-left shadow-md flex justify-between items-center";
            correctBtn.querySelector('i').className = "fa-solid fa-circle-check text-emerald-500";
        }

        function nextQuestion() {
            questionIndex++;
            if (questionIndex < currentQuestions.length) {
                loadQuestion();
            } else {
                showResult();
            }
        }

        // Tampilkan Hasil Akhir Kuis
        function showResult() {
            showScreen('screen-result');
            document.getElementById('final-score').innerText = score;
            document.getElementById('final-correct').innerText = `${correctAnswersCount} / ${currentQuestions.length}`;

            // Pemicu Confetti jika skor bagus
            if (correctAnswersCount >= 3) {
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            }

            // Simpan Skor Tertinggi ke LocalStorage
            const savedHighScore = parseInt(localStorage.getItem('quiz_high_score') || 0);
            if (score > savedHighScore) {
                localStorage.setItem('quiz_high_score', score);
            }
        }

        function restartQuiz() {
            selectCategory(currentCategory);
        }

        function updateHighScoreUI() {
            const savedHighScore = localStorage.getItem('quiz_high_score') || 0;
            document.getElementById('high-score').innerText = savedHighScore;
        }

        // Inisialisasi awal saat pertama kali dimuat
        updateHighScoreUI();
    </script>
</body>
</html>
